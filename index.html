<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#06060E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="СЦБ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Справочник СЦБ</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #06060E; color: #F4F4FF; font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box;
    background: radial-gradient(420px 360px at 0% 0%, rgba(124,58,237,.42), transparent 62%),
                radial-gradient(380px 340px at 100% 60%, rgba(34,211,238,.16), transparent 62%), #06060E; }
  .card { width: 100%; max-width: 360px; box-sizing: border-box; padding: 28px 22px 24px; border-radius: 28px;
    background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.04)); border: 1px solid rgba(255,255,255,.10);
    box-shadow: 0 30px 60px -30px rgba(0,0,0,.9); display: grid; gap: 14px; }
  img { width: 72px; height: 72px; border-radius: 20px; box-shadow: 0 10px 30px -8px rgba(124,58,237,.7); }
  h1 { margin: 4px 0 0; font-size: 22px; }
  p { margin: 0; color: #9A9AB8; font-size: 14px; }
  input[type=password] { width: 100%; box-sizing: border-box; font: 17px system-ui, sans-serif; color: #fff; padding: 15px 16px; border-radius: 18px;
    background: rgba(0,0,0,.45); border: 1.5px solid rgba(139,92,246,.55); outline: 0; box-shadow: inset 0 2px 6px rgba(0,0,0,.7); }
  input[type=password]:focus { border-color: #22D3EE; box-shadow: inset 0 2px 6px rgba(0,0,0,.7), 0 0 0 4px rgba(34,211,238,.18); }
  label.rem { display: flex; gap: 10px; align-items: center; color: #C9C9E3; font-size: 14px; }
  label.rem input { width: 20px; height: 20px; accent-color: #8B5CF6; }
  button { min-height: 52px; border: 1px solid rgba(255,255,255,.18); border-radius: 18px; color: #fff; font: 600 16px system-ui, sans-serif; cursor: pointer;
    background: linear-gradient(135deg, #8B5CF6, #3B82F6 55%, #22D3EE);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 4px 0 #2E1A7A, 0 10px 26px -6px rgba(124,58,237,.65); transition: transform .15s; }
  button:active { transform: translateY(4px); box-shadow: inset 0 2px 6px rgba(20,10,60,.55); }
  button[disabled] { opacity: .6; }
  .err { color: #FCA5A5; font-size: 14px; min-height: 1.2em; }
</style>
</head>
<body>
<form class="card" id="f" autocomplete="off">
  <img src="icon-192.png" alt="">
  <h1>Справочник СЦБ</h1>
  <p>Введите пароль, чтобы открыть справочник.</p>
  <input type="password" id="pw" aria-label="Пароль" placeholder="Пароль" autocomplete="current-password" required>
  <label class="rem"><input type="checkbox" id="rem" checked> Запомнить на этом устройстве</label>
  <button id="go" type="submit">Открыть</button>
  <div class="err" id="err" role="alert"></div>
</form>
<script>
(function () {
  var SALT = 'Sgb8vgI8iStS1LS7R9NxxQ==', IV = 'QOl0Gr1HOjd0CAN/', ITER = 310000, KEYNAME = 'scb.key.e05ded8595';
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
  var b64 = function (s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; };
  var toB64 = function (buf) { var u = new Uint8Array(buf), s = ''; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); };
  var store = { get: function () { try { return localStorage.getItem(KEYNAME); } catch (e) { return null; } },
                set: function (v) { try { localStorage.setItem(KEYNAME, v); } catch (e) {} },
                del: function () { try { localStorage.removeItem(KEYNAME); } catch (e) {} } };
  var payload = fetch('app.bin').then(function (r) { if (!r.ok) throw new Error('net'); return r.arrayBuffer(); });

  function open(key) {
    return payload.then(function (data) {
      return crypto.subtle.decrypt({ name: 'AES-GCM', iv: new Uint8Array(data, 0, 12) }, key, new Uint8Array(data, 12));
    }).then(function (plain) { return new TextDecoder().decode(plain); });
  }
  function show(html) { document.open(); document.write(html); document.close(); }
  function derive(pw) {
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']).then(function (base) {
      return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(SALT), iterations: ITER, hash: 'SHA-256' }, base,
        { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
    });
  }
  var saved = store.get();
  if (saved) {
    try { sessionStorage.setItem('scb.k', saved); } catch (e) {}
    crypto.subtle.importKey('raw', b64(saved), 'AES-GCM', true, ['decrypt']).then(open).then(show).catch(function () { store.del(); });
  }
  document.getElementById('f').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var btn = document.getElementById('go'), err = document.getElementById('err');
    btn.disabled = true; btn.textContent = 'Открываю…'; err.textContent = '';
    derive(document.getElementById('pw').value).then(function (key) {
      var remember = document.getElementById('rem').checked;
      return open(key).then(function (html) {
        var save = crypto.subtle.exportKey('raw', key).then(function (raw) { var r = toB64(raw); try { sessionStorage.setItem('scb.k', r); } catch (e) {} if (remember) store.set(r); });
        return save.then(function () { show(html); });
      });
    }).catch(function (e) {
      btn.disabled = false; btn.textContent = 'Открыть';
      err.textContent = (e && e.message === 'net') ? 'Нет связи — откройте один раз с интернетом.' : 'Неверный пароль.';
    });
  });
})();
</script>
</body>
</html>
