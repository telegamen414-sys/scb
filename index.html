<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#06060E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="СЦБ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Справочник СЦБ</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #06060E; color: #F4F4FF; font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box; background: transparent; }
  body::after, #splash::after { content: ""; position: fixed; inset: 0; z-index: -1; background: url(bgb.jpg) 86% 50% / cover no-repeat, #06060E; }
  #splash::after { background-image: url(bg.jpg); }
  .card { position: relative; width: 100%; max-width: 358px; box-sizing: border-box; padding: 26px 25px 25px; border-radius: 50px;
    background: rgba(255,255,255,.10); box-shadow: 2px 4px 16px rgba(0,0,0,.16), inset 1px 1px 0 rgba(255,255,255,.2);
    -webkit-backdrop-filter: blur(19px) saturate(1.4); backdrop-filter: blur(19px) saturate(1.4); display: grid; gap: 14px; }
  .glass::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.5px; pointer-events: none;
    background: linear-gradient(150deg, #fff 0%, rgba(255,255,255,.5) 40%, rgba(255,255,255,0) 75%, #fff 100%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
  .logo2 { position: relative; height: 53px; border-radius: 50px; display: grid; place-items: center; align-content: center; gap: 2px;
    background: linear-gradient(90deg, rgba(139,92,246,.2), rgba(59,130,246,.2) 50%, rgba(34,211,238,.2));
    box-shadow: inset 1.5px 1.5px 0 rgba(255,255,255,.35), inset -1px -1px 0 rgba(255,255,255,.15); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  .logo2 .dots { display: flex; gap: 4px; } .logo2 .dots i { width: 10px; height: 10px; border-radius: 50%; display: block; }
  .logo2 b { font: 600 22px/1.1 Onest, system-ui, sans-serif; color: #F4F4FF; }
  h1 { margin: 4px 0 0; font: 600 20px/1.25 Unbounded, system-ui, sans-serif; letter-spacing: -.01em; }
  p { margin: 0; color: #9A9AB8; font-size: 13px; }
  .field { position: relative; border-radius: 50px; box-shadow: 0 4px 4px rgba(0,0,0,.25); background: rgba(255,255,255,.01);
    -webkit-backdrop-filter: blur(6px) saturate(1.3); backdrop-filter: blur(6px) saturate(1.3); }
  input[type=password] { width: 100%; box-sizing: border-box; font: 18px system-ui, sans-serif; color: #fff; padding: 0 20px; height: 60px; border-radius: 50px;
    background: transparent; border: 0; outline: 0; }
  input[type=password]::placeholder { color: #F9F9F9; opacity: .9; }
  .field:focus-within { box-shadow: 0 4px 4px rgba(0,0,0,.25), 0 0 0 4px rgba(34,211,238,.25); }
  label.rem { display: flex; gap: 10px; align-items: center; color: #fff; font-size: 13px; }
  label.rem input { appearance: none; -webkit-appearance: none; margin: 0; width: 20px; height: 20px; border-radius: 50%; background: rgba(255,255,255,.10);
    box-shadow: inset 1px 1px 0 rgba(255,255,255,.35), inset -1px -1px 0 rgba(255,255,255,.12); display: grid; place-items: center; flex: none; }
  label.rem input:checked { background: rgba(139,92,246,.55); }
  label.rem input:checked::after { content: ""; width: 5px; height: 9px; border: solid #fff; border-width: 0 2px 2px 0; transform: translateY(-1px) rotate(45deg); }
  button { position: relative; height: 61px; border: 0; border-radius: 50px; color: #D9D9D9; font: 600 15px Onest, system-ui, sans-serif; cursor: pointer;
    background: rgba(255,255,255,.02); box-shadow: 0 4px 4px rgba(0,0,0,.25); -webkit-backdrop-filter: blur(6px) saturate(1.3); backdrop-filter: blur(6px) saturate(1.3); transition: transform .15s; }
  button:active { transform: scale(.98); background: rgba(255,255,255,.08); }
  button[disabled] { opacity: .6; }
  .err { color: #FCA5A5; font-size: 14px; min-height: 1.2em; }
  #splash { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; overflow: hidden; background: #06060E; transition: opacity .45s ease; }
  #splash.out { opacity: 0; pointer-events: none; }
  #splash { isolation: isolate; background: transparent; }
  #splash::after { position: absolute; }
  #splash .logo { position: relative; z-index: 1; margin: 0; font: 400 128px/1.12 "Times New Roman", Georgia, serif; text-align: center; color: rgba(255,255,255,.10);
    -webkit-text-stroke: 1px #D92A2A; text-shadow: 0 0 1px rgba(255,255,255,.25), 0 2px 18px rgba(217,42,42,.25); animation: splashIn .9s cubic-bezier(.2,.8,.2,1) both; }
  #splash .logo span { display: block; }
  @keyframes splashIn { from { opacity: 0; transform: translateY(12px) scale(.96); letter-spacing: .1em; } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div id="splash" aria-hidden="true"></div>
<form class="card glass" id="f" autocomplete="off">
  <div class="logo2"><span class="dots"><i style="background:#FF4D42"></i><i style="background:#F4B63F"></i><i style="background:#2FD27A"></i></span><b>СЦБ</b></div>
  <h1>Справочник СЦБ</h1>
  <p>Введите пароль, чтобы открыть справочник.</p>
  <div class="field glass"><input type="password" id="pw" aria-label="Пароль" placeholder="Пароль" autocomplete="current-password" required></div>
  <label class="rem"><input type="checkbox" id="rem" checked> Запомнить на этом устройстве</label>
  <button class="glass" id="go" type="submit">Открыть</button>
  <div class="err" id="err" role="alert"></div>
</form>
<script>
(function () {
  var SALT = 'Sgb8vgI8iStS1LS7R9NxxQ==', IV = 'C1D5GDTZg2JCJztM', ITER = 310000, KEYNAME = 'scb.key.e05ded8595';
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
  var b64 = function (s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; };
  var toB64 = function (buf) { var u = new Uint8Array(buf), s = ''; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); };
  var store = { get: function () { try { return localStorage.getItem(KEYNAME); } catch (e) { return null; } },
                set: function (v) { try { localStorage.setItem(KEYNAME, v); } catch (e) {} },
                del: function () { try { localStorage.removeItem(KEYNAME); } catch (e) {} } };
  var payload = fetch('app.bin').then(function (r) { if (!r.ok) throw new Error('net'); return r.arrayBuffer(); });

  function open(key) {
    return payload.then(function (data) {
      return crypto.subtle.decrypt({ name: 'AES-GCM', iv: new Uint8Array(data, 0, 12) }, key, new Uint8Array(data, 12));
    }).then(function (plain) { return new TextDecoder().decode(plain); });
  }
  var T0 = Date.now(), SPLASH = 1500;
  var hideSplash = function () { var sp = document.getElementById('splash'); if (sp && !sp.classList.contains('out')) { sp.classList.add('out'); setTimeout(function () { sp.remove(); }, 500); } };
  setTimeout(function () { if (!store.get()) hideSplash(); }, SPLASH);
  function show(html) { var wait = Math.max(0, SPLASH - (Date.now() - T0)); setTimeout(function () { document.open(); document.write(html); document.close(); }, wait); }
  function derive(pw) {
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']).then(function (base) {
      return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(SALT), iterations: ITER, hash: 'SHA-256' }, base,
        { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
    });
  }
  var saved = store.get();
  if (saved) {
    // Открываем по запомненному ключу; форму пока прячем, чтобы не казалось, что просят пароль.
    var card = document.getElementById('f'); card.style.visibility = 'hidden';
    try { sessionStorage.setItem('scb.k', saved); } catch (e) {}
    var refetch = function () { payload = fetch('app.bin?r=' + Date.now(), { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error('net'); return r.arrayBuffer(); }); };
    var tryOpen = function (n) {
      crypto.subtle.importKey('raw', b64(saved), 'AES-GCM', true, ['decrypt']).then(open).then(show).catch(function () {
        // Не расшифровалось или нет сети: чаще всего файл ещё обновляется на сервере. Ключ НЕ стираем — пробуем снова.
        if (n < 4) { refetch(); setTimeout(function () { tryOpen(n + 1); }, 1500 * (n + 1)); return; }
        card.style.visibility = ''; hideSplash();
        document.getElementById('err').textContent = 'Не удалось открыть — проверьте интернет и откройте приложение снова.';
      });
    };
    tryOpen(0);
  }
  document.getElementById('f').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var btn = document.getElementById('go'), err = document.getElementById('err');
    btn.disabled = true; btn.textContent = 'Открываю…'; err.textContent = '';
    derive(document.getElementById('pw').value).then(function (key) {
      var remember = document.getElementById('rem').checked;
      return open(key).then(function (html) {
        var save = crypto.subtle.exportKey('raw', key).then(function (raw) { var r = toB64(raw); try { sessionStorage.setItem('scb.k', r); } catch (e) {} if (remember) store.set(r); });
        return save.then(function () { show(html); });
      });
    }).catch(function (e) {
      btn.disabled = false; btn.textContent = 'Открыть';
      err.textContent = (e && e.message === 'net') ? 'Нет связи — откройте один раз с интернетом.' : 'Неверный пароль.';
    });
  });
})();
</script>
</body>
</html>
