name: Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build
        working-directory: android
        env:
          APK_CODE: ${{ github.run_number }}
          APK_NAME: 1.${{ github.run_number }}
        run: gradle --no-daemon assembleRelease
      - name: Publish scb.apk
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk scb.apk
          echo "1.${{ github.run_number }}" > apk-version.txt
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add scb.apk apk-version.txt
          git commit -m "APK 1.${{ github.run_number }} [skip ci]" || exit 0
          git pull --rebase
          git push
